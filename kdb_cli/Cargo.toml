[package]
name = "kdb_cli"
version = "4.4.0"
edition = "2024"

[[bin]]
name = "kdb"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
rpassword = "7.3"
dirs = "5.0"
